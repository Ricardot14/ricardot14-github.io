name: iMac Bridge v4 installer syntax check
on:
  push:
    paths:
      - imac-bridge-v4-activate
      - .github/workflows/imac-v4-installer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: POSIX shell parse
        run: |
          /bin/sh -n imac-bridge-v4-activate
          sha256sum imac-bridge-v4-activate
